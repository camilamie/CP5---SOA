spring.application.name=autoescola
server.port=8085


spring.datasource.url=jdbc:h2:file:./data/autoescola
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-stacktrace=never

api.security.token.secret=${JWT_SECRET:fiap-autoescola-cp4-segredo}

#CP5
api.viacep.url=https://viacep.com.br/ws

api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Swagger: http://localhost:8085/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha